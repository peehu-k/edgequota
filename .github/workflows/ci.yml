name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build
        run: mvn -B -DskipTests package

      - name: Test
        run: mvn -B test

      - name: Run simulation / benchmark harness
        run: java -cp target/classes com.edgequota.sim.SimulationRunner

  docker-cluster-smoke-test:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build and start 5-node cluster
        run: docker compose up --build -d

      - name: Wait for nodes to come up
        run: sleep 10

      - name: Smoke test each node
        run: |
          for port in 8081 8082 8083 8084 8085; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "X-Tenant-Id: acme" \
              -d '{"probe":"ci"}' "http://localhost:${port}/v1/probe")
            echo "node on :${port} -> HTTP ${code}"
            if [ "$code" != "200" ] && [ "$code" != "429" ]; then
              echo "unexpected status code from node on :${port}"
              exit 1
            fi
          done

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
